name: Build CherryGram via Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup API Keys & Config
        run: |
          mkdir -p TMessagesProj/src/main/java/uz/unnarsx/cherrygram
          cat << 'EOF' > TMessagesProj/src/main/java/uz/unnarsx/cherrygram/Extra.kt
          package uz.unnarsx.cherrygram

          object Extra {
              const val APP_ID = ${{ secrets.APP_ID }}
              const val APP_HASH = "${{ secrets.APP_HASH }}"
          }
          EOF
          cp secrets_for_ci.env.example secrets_for_ci.env

      - name: Build Docker Image and Compile APK
        run: |
          # 1. Repo ke Dockerfile se image build karo
          docker build -t cherrygram-env .

          # 2. Container run karke arm64 APK compile karo
          docker run --name temp-builder cherrygram-env ./gradlew assembleArm64Release --no-daemon

      - name: Extract APK from Docker Container
        run: |
          mkdir -p extracted-apk
          # 3. Container ke andar bani APK ko bahar nikal lo
          docker cp temp-builder:/app/TMessagesProj/build/outputs/apk/arm64/release/ ./extracted-apk/ || \
          docker cp temp-builder:/workspace/TMessagesProj/build/outputs/apk/arm64/release/ ./extracted-apk/ || true
          
          ls -R extracted-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CherryGram-Docker-APK
          path: extracted-apk/**/*.apk
