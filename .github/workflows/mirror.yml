name: Build CherryGram Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_JVMARGS: "-Xmx6g -Xss32m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Environment (Free up Space)
        run: |
          sudo apt-get remove -y '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli firefox mono-devel
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet/ /usr/local/graalvm/ /usr/local/lib/node_modules
          df -h

      - name: Create and Setup Extra.kt
        run: |
          # 1. Exact folder create karega
          mkdir -p TMessagesProj/src/main/java/uz/unnarsx/cherrygram
          
          # 2. Ekdum nayi Extra.kt file banakar usme Kotlin code aur API keys inject karega
          cat << 'EOF' > TMessagesProj/src/main/java/uz/unnarsx/cherrygram/Extra.kt
          package uz.unnarsx.cherrygram

          object Extra {
              const val APP_ID = ${{ secrets.APP_ID }}
              const val APP_HASH = "${{ secrets.APP_HASH }}"
          }
          EOF
          
          echo "Extra.kt file successfully created!"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (Standalone)
        run: ./gradlew :TMessagesProj_AppStandalone:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CherryGram-Release-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/release/*.apk
