name: Build CherryGram Nuclear Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Nuke NDK 27 and Install NDK 25
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libstdc++6 zlib1g-dev
          
          # NUKE: Delete the stubborn NDK 27 completely from the runner
          sudo rm -rf /usr/local/lib/android/sdk/ndk/27.2.12479018
          
          # Install clean stable NDK 25
          echo "y" | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"

      - name: Force NDK Version in Properties
        run: |
          echo "android.ndkVersion=25.2.9519653" >> gradle.properties

      - name: Setup API Keys & Config
        run: |
          mkdir -p TMessagesProj/src/main/java/uz/unnarsx/cherrygram
          cat << 'EOF' > TMessagesProj/src/main/java/uz/unnarsx/cherrygram/Extra.kt
          package uz.unnarsx.cherrygram

          object Extra {
              const val APP_ID = ${{ secrets.APP_ID }}
              const val APP_HASH = "${{ secrets.APP_HASH }}"
          }
          EOF
          cp secrets_for_ci.env.example secrets_for_ci.env

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Cache and Build
        run: |
          rm -rf TMessagesProj/.cxx TMessagesProj/build
          ./gradlew clean --no-daemon
          ./gradlew assembleAfatDebug --no-daemon

      - name: Extract and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CherryGram-Nuclear-APK
          path: TMessagesProj/build/outputs/apk/afat/debug/**/*.apk
