name: Build CherryGram Self-Healing

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup API Keys & Config
        run: |
          mkdir -p TMessagesProj/src/main/java/uz/unnarsx/cherrygram
          cat << 'EOF' > TMessagesProj/src/main/java/uz/unnarsx/cherrygram/Extra.kt
          package uz.unnarsx.cherrygram

          object Extra {
              const val APP_ID = ${{ secrets.APP_ID }}
              const val APP_HASH = "${{ secrets.APP_HASH }}"
          }
          EOF
          cp secrets_for_ci.env.example secrets_for_ci.env

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Smart Self-Healing Build Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libstdc++6 zlib1g-dev

          echo "=== ATTEMPT 1: Trying with Latest CMake 3.30.3 ==="
          echo "y" | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3" || true
          
          if ./gradlew assembleAfatDebug --no-daemon; then
              echo "Build Successful on Attempt 1!"
              exit 0
          fi

          echo "=== ATTEMPT 1 FAILED. Switching to Fallback CMake 3.22.1 & Cleaning CXX Cache ==="
          rm -rf TMessagesProj/.cxx TMessagesProj/build
          ./gradlew clean --no-daemon

          echo "y" | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" || true

          if ./gradlew assembleAfatDebug --no-daemon; then
              echo "Build Successful on Attempt 2 (Fallback)!"
              exit 0
          fi

          echo "=== ALL ATTEMPTS FAILED. Forcing Gradle Info Mode ==="
          ./gradlew assembleAfatDebug --info --no-daemon
          exit 1

      - name: Extract and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CherryGram-Bulletproof-APK
          path: TMessagesProj/build/outputs/apk/afat/debug/**/*.apk
