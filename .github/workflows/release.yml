name: Build Cherrygram Official NDK27

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Essential Build Tools & NDK 27
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libstdc++6 zlib1g-dev lib32stdc++6 libc6-dev-i386
          echo "y" | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Setup API Keys & Config
        run: |
          mkdir -p TMessagesProj/src/main/java/uz/unnarsx/cherrygram
          cat << 'EOF' > TMessagesProj/src/main/java/uz/unnarsx/cherrygram/Extra.kt
          package uz.unnarsx.cherrygram

          object Extra {
              const val APP_ID = ${{ secrets.APP_ID }}
              const val APP_HASH = "${{ secrets.APP_HASH }}"
          }
          EOF
          cp secrets_for_ci.env.example secrets_for_ci.env

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Cache and Build
        run: |
          rm -rf TMessagesProj/.cxx TMessagesProj/build
          ./gradlew clean --no-daemon
          ./gradlew assembleAfatDebug --no-daemon

      - name: Extract and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cherrygram-Official-APK
          path: TMessagesProj/build/outputs/apk/afat/debug/**/*.apk
