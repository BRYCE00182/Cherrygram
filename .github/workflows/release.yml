name: Build CherryGram via Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup API Keys & Config
        run: |
          mkdir -p TMessagesProj/src/main/java/uz/unnarsx/cherrygram
          cat << 'EOF' > TMessagesProj/src/main/java/uz/unnarsx/cherrygram/Extra.kt
          package uz.unnarsx.cherrygram

          object Extra {
              const val APP_ID = ${{ secrets.APP_ID }}
              const val APP_HASH = "${{ secrets.APP_HASH }}"
          }
          EOF
          cp secrets_for_ci.env.example secrets_for_ci.env

      - name: Build Docker Image
        run: docker build -t cherrygram-env .

      - name: Run Build inside Container
        run: |
          docker run --name temp-builder -v ${{ github.workspace }}:/project --workdir /project --entrypoint /bin/bash cherrygram-env -c "apt-get update && apt-get install -y build-essential libstdc++6 zlib1g-dev && git config --global --add safe.directory /project && chmod +x gradlew && rm -rf TMessagesProj/.cxx && ./gradlew clean && ./gradlew assembleAfatDebug --no-daemon"

      - name: Extract APK from Docker Container
        run: |
          mkdir -p extracted-apk
          cp -r TMessagesProj/build/outputs/apk/afat/debug/ extracted-apk/ || true
          ls -R extracted-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CherryGram-Docker-APK
          path: extracted-apk/**/*.apk
